<!DOCTYPE html>
<html class="dark" lang="pt-br">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EngeSEP O&amp;M IA - Kinetic Cockpit</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;family=Inter:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-surface-variant": "#a6abb4",
                        "surface-container-low": "#0d141b",
                        "outline": "#70767e",
                        "primary-dim": "#02aeef",
                        "on-secondary-fixed-variant": "#4c5e6a",
                        "secondary-dim": "#c4d7e5",
                        "surface-bright": "#242d37",
                        "secondary": "#d2e5f4",
                        "on-error-container": "#ffa8a3",
                        "surface": "#090f15",
                        "surface-dim": "#090f15",
                        "secondary-container": "#374955",
                        "inverse-primary": "#00668e",
                        "primary": "#54c3ff",
                        "on-tertiary-fixed": "#0d005f",
                        "error": "#ff716c",
                        "tertiary-fixed": "#aaa8ff",
                        "on-error": "#490006",
                        "on-primary": "#003b54",
                        "surface-variant": "#1e272f",
                        "tertiary-fixed-dim": "#9b98ff",
                        "on-secondary": "#425460",
                        "on-primary-fixed": "#001a28",
                        "on-tertiary-container": "#120076",
                        "surface-container-high": "#182028",
                        "on-tertiary-fixed-variant": "#2e2792",
                        "tertiary-container": "#9592ff",
                        "primary-fixed-dim": "#02aeef",
                        "surface-tint": "#54c3ff",
                        "on-secondary-fixed": "#30424d",
                        "secondary-fixed": "#d2e5f4",
                        "secondary-fixed-dim": "#c4d7e5",
                        "surface-container-highest": "#1e272f",
                        "on-secondary-container": "#c0d3e1",
                        "on-surface": "#e6ebf4",
                        "tertiary-dim": "#9592ff",
                        "on-primary-fixed-variant": "#003e58",
                        "error-dim": "#d7383b",
                        "tertiary": "#a4a1ff",
                        "background": "#090f15",
                        "surface-container-lowest": "#000000",
                        "primary-container": "#21b6f8",
                        "error-container": "#9f0519",
                        "primary-fixed": "#2dbcfe",
                        "inverse-surface": "#f7f9ff",
                        "surface-container": "#131a22",
                        "on-tertiary": "#201585",
                        "on-background": "#e6ebf4",
                        "inverse-on-surface": "#50565d",
                        "outline-variant": "#424850",
                        "on-primary-container": "#003045"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Space Grotesk"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .gauge-svg { transform: rotate(-90deg); }
        .glass-panel {
            backdrop-filter: blur(20px);
            background: rgba(36, 45, 55, 0.6);
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #090f15; }
        ::-webkit-scrollbar-thumb { background: #1e272f; border-radius: 2px; }
    </style>
    {% block head %}{% endblock %}
</head>
<body class="bg-background text-on-surface font-body selection:bg-primary-dim selection:text-on-primary-fixed">
    {% include 'componentes/header.html' %}

    <main class="p-6 space-y-6 max-w-[1600px] mx-auto pb-24">
        {% block content %}{% endblock %}
    </main>

    {% include 'componentes/bottom_nav.html' %}
</body>
</html>
