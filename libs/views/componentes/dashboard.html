{% extends 'componentes/base.html' %}

{% block content %}
<!-- ── Overlay translúcido + blur (skeleton visível por baixo) ── -->
<div id="loadOverlay" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:rgba(9,15,21,0.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);">
    <div style="text-align:center;width:320px;">
        <div style="font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:700;color:#02aeef;letter-spacing:0.15em;text-transform:uppercase;margin-bottom:32px;">
            EngeSEP O&amp;M IA
        </div>
        <div style="width:100%;height:3px;background:#1e272f;border-radius:2px;overflow:hidden;">
            <div id="loadBar" style="width:0%;height:100%;background:linear-gradient(90deg,#02aeef,#54c3ff);border-radius:2px;transition:width 0.3s ease;"></div>
        </div>
        <div id="loadPercent" style="font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:#e6ebf4;margin-top:16px;">0%</div>
        <div id="loadStatus" style="font-family:'Inter',sans-serif;font-size:10px;color:#a6abb4;margin-top:8px;letter-spacing:0.05em;text-transform:uppercase;">
            Consultando banco de dados…
        </div>
    </div>
</div>

<!-- ── Skeleton estático puro (HTML/CSS, sem Jinja, sem script) ── -->
<!-- Substituído automaticamente pelo innerHTML do AJAX -->

<div id="section-gauges">
    <div class="space-y-4">
        <div class="bg-surface-container-highest p-5 rounded border-l-2 shadow-sm animate-pulse" style="border-left-color:#02aeef;">
            <div class="flex justify-between">
                <div><div class="h-3 w-28 bg-surface-variant rounded mb-3"></div><div class="h-7 w-16 bg-surface-variant rounded"></div></div>
                <div class="text-right"><div class="h-3 w-24 bg-surface-variant rounded mb-3"></div><div class="h-6 w-14 bg-surface-variant rounded"></div></div>
            </div>
        </div>
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div class="bg-surface-container-highest p-4 rounded border-l-2 shadow-sm animate-pulse flex flex-col items-center justify-center h-28" style="border-left-color:#60A5FA;"><div class="h-2 w-16 bg-surface-variant rounded mb-3"></div><div class="w-16 h-8 bg-surface-variant rounded-full"></div></div>
            <div class="bg-surface-container-highest p-4 rounded border-l-2 shadow-sm animate-pulse flex flex-col items-center justify-center h-28" style="border-left-color:#A78BFA;"><div class="h-2 w-16 bg-surface-variant rounded mb-3"></div><div class="w-16 h-8 bg-surface-variant rounded-full"></div></div>
            <div class="bg-surface-container-highest p-4 rounded border-l-2 shadow-sm animate-pulse flex flex-col items-center justify-center h-28" style="border-left-color:#34D399;"><div class="h-2 w-16 bg-surface-variant rounded mb-3"></div><div class="w-16 h-8 bg-surface-variant rounded-full"></div></div>
            <div class="bg-surface-container-highest p-4 rounded border-l-2 shadow-sm animate-pulse flex flex-col items-center justify-center h-28" style="border-left-color:#FB923C;"><div class="h-2 w-16 bg-surface-variant rounded mb-3"></div><div class="w-16 h-8 bg-surface-variant rounded-full"></div></div>
            <div class="bg-surface-container-highest p-4 rounded border-l-2 shadow-sm animate-pulse flex flex-col items-center justify-center h-28" style="border-left-color:#FB7185;"><div class="h-2 w-16 bg-surface-variant rounded mb-3"></div><div class="w-16 h-8 bg-surface-variant rounded-full"></div></div>
        </div>
    </div>
</div>

<div id="section-generation">
    <div class="bg-surface-container-low rounded p-6 shadow-xl border border-outline-variant/10 animate-pulse">
        <div class="flex justify-between items-center mb-8">
            <div><div class="h-5 w-56 bg-surface-variant rounded mb-2"></div><div class="h-3 w-40 bg-surface-variant/50 rounded"></div></div>
            <div class="h-8 w-64 bg-surface-variant rounded"></div>
        </div>
        <div class="flex gap-6">
            <div class="flex-1 h-[340px] bg-surface-variant/20 rounded"></div>
            <div class="hidden lg:flex flex-col w-72 gap-4">
                <div class="h-32 bg-surface-variant/20 rounded"></div>
                <div class="h-28 bg-surface-variant/20 rounded"></div>
                <div class="h-28 bg-surface-variant/20 rounded"></div>
            </div>
        </div>
    </div>
</div>

<div id="section-reservoir">
    <div class="bg-surface-container-low rounded p-6 shadow-xl border border-outline-variant/10 animate-pulse">
        <div class="h-5 w-48 bg-surface-variant rounded mb-6"></div>
        <div class="h-[250px] bg-surface-variant/20 rounded"></div>
    </div>
</div>

<script>
(function () {
    /* ── Fase 1: Carga inicial ── */

    var bar     = document.getElementById('loadBar');
    var pct     = document.getElementById('loadPercent');
    var statusEl = document.getElementById('loadStatus');
    var overlay = document.getElementById('loadOverlay');
    var progress = 0, done = false, t0 = Date.now(), EXPECTED = 25000;

    function tick() {
        if (done) return;
        var elapsed = Date.now() - t0;
        var target = Math.min(88, 88 * Math.pow(elapsed / EXPECTED, 0.55));
        progress += (target - progress) * 0.12;
        bar.style.width = progress + '%';
        pct.textContent = Math.round(progress) + '%';
        requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    function execScripts(container) {
        container.querySelectorAll('script').forEach(function (old) {
            var s = document.createElement('script');
            s.textContent = old.textContent;
            old.parentNode.replaceChild(s, old);
        });
    }

    function finalizarCarga() {
        done = true;
        window.__perfAjax = Date.now() - t0;
        console.log('[PERF] Dados: ' + window.__perfAjax + 'ms');

        bar.style.width = '100%';
        pct.textContent = '100%';
        statusEl.textContent = 'Pronto';

        setTimeout(function () {
            overlay.style.transition = 'opacity 0.4s ease';
            overlay.style.opacity = '0';
            setTimeout(function () { overlay.remove(); }, 400);
        }, 350);
    }

    var params = new URLSearchParams(window.location.search);

    fetch('/api/dashboard?' + params.toString())
        .then(function (r) { return r.json(); })
        .then(function (data) {
            statusEl.textContent = 'Renderizando…';

            document.getElementById('section-gauges').innerHTML     = data.gauge_grid;
            document.getElementById('section-generation').innerHTML  = data.generation_chart;
            document.getElementById('section-reservoir').innerHTML   = data.reservoir_chart;

            execScripts(document.getElementById('section-gauges'));
            execScripts(document.getElementById('section-generation'));
            execScripts(document.getElementById('section-reservoir'));

            interceptarFiltros();
            finalizarCarga();
        })
        .catch(function (err) {
            console.error('[LOAD] Erro:', err);
            statusEl.textContent = 'Erro ao carregar dados';
            bar.style.background = '#ff716c';
            pct.textContent = '!';
        });

    /* ── Fase 2: Troca de filtros (sem reload, sem recriar socket) ── */

    var _abortCtrl = null;

    function interceptarFiltros() {
        var sec = document.getElementById('section-generation');
        if (!sec) return;

        sec.querySelectorAll('input[type="date"]').forEach(function (el) {
            el.removeAttribute('onchange');
            el.addEventListener('change', submeterFiltro);
        });

        sec.querySelectorAll('button[data-periodo]').forEach(function (btn) {
            btn.removeAttribute('onclick');
            btn.addEventListener('click', function () {
                var input = document.getElementById('periodoInput');
                if (input) input.value = btn.dataset.periodo;
                submeterFiltro();
            });
        });
    }

    function submeterFiltro() {
        var form = document.getElementById('filtroForm');
        if (!form) return;
        recarregarDashboard(new URLSearchParams(new FormData(form)).toString());
    }

    function recarregarDashboard(queryString) {
        if (_abortCtrl) _abortCtrl.abort();
        _abortCtrl = new AbortController();

        var ov = document.getElementById('reloadOverlay');
        if (!ov) {
            ov = document.createElement('div');
            ov.id = 'reloadOverlay';
            ov.style.cssText = 'position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:rgba(9,15,21,0.4);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity 0.3s ease;';
            ov.innerHTML =
                '<div style="text-align:center;">' +
                    '<div style="width:200px;height:3px;background:#1e272f;border-radius:2px;overflow:hidden;">' +
                        '<div style="height:100%;background:linear-gradient(90deg,#02aeef,#54c3ff);border-radius:2px;animation:_rl 2s ease-in-out infinite;"></div>' +
                    '</div>' +
                    '<div style="font-family:Inter,sans-serif;font-size:10px;color:#a6abb4;margin-top:10px;letter-spacing:0.05em;text-transform:uppercase;">Atualizando dados\u2026</div>' +
                '</div>' +
                '<style>@keyframes _rl{0%{width:0}50%{width:70%}100%{width:95%}}</style>';
            document.body.appendChild(ov);
        }
        ov.style.opacity = '1';

        fetch('/api/dashboard?' + queryString, { signal: _abortCtrl.signal })
            .then(function (r) { return r.json(); })
            .then(function (data) {
                document.getElementById('section-generation').innerHTML = data.generation_chart;
                document.getElementById('section-reservoir').innerHTML  = data.reservoir_chart;

                execScripts(document.getElementById('section-generation'));
                execScripts(document.getElementById('section-reservoir'));

                interceptarFiltros();

                ov.style.opacity = '0';
                setTimeout(function () { ov.remove(); }, 300);

                history.pushState(null, '', '?' + queryString);
            })
            .catch(function (err) {
                if (err.name === 'AbortError') return;
                console.error('[RELOAD] Erro:', err);
                if (ov) ov.remove();
            });
    }
})();
</script>
{% endblock %}
